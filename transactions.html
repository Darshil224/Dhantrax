          <a href="dashboard.html" class="nav-option">

          <a href="transactions.html" class="nav-option-active">
            <img
              src="icons/transaction-14855 (1).svg"

            />Transactions
          </a>
          <a href="budgets.html" class="nav-option">

              src="icons/chart-pie-solid-full.svg"
              alt="budget icon"
            />Budgets
          </a>
          <a href="reports.html" class="nav-option">
            <img
              src="icons/financial-report-14776.svg"
              alt="reports icon"
            />Reports
          </a>
          <a href="savings-goals.html" class="nav-option">
            <img
              src="icons/target-and-arrow-12218.svg"
              alt="savings goals icon"
            />Savings Goals
          </a>
        </div>
        <div class="export-link-container">
          <img
            class="export-icon"
            src="icons/export-arrow-14574.svg"
            alt="export icon"
          />
          <a href="#" class="export-link">Export Data</a>
        </div>
      </div>
      <div class="main-content">
        <div class="transactions-header">
          <h2>Transactions</h2>
          <button class="add-transaction-button js-add-transaction-button">
            &plus; Add Transaction
          </button>
        </div>
        <div class="transaction-form js-transaction-form">
          <h3>Add Transaction</h3>
          <div class="transaction-form-inner-container">
            <div>
              <label>Date</label>
              <input
                type="date"
                class="date-input js-date-input"
                placeholder="Enter Date"
              />
            </div>
            <div>
              <label>Description</label>
              <input
                type="text"
                class="description-input js-description-input"
                placeholder="Enter description"
              />
            </div>

            <div>
              <label>Category</label>
              <select class="category-input js-category-input">
                <option value="" selected disabled>Select Category</option>
                <optgroup label="Income">
                  <option value="Salary">Salary</option>
                  <option value="Freelance">Freelance</option>
                  <option value="Business">Business</option>
                  <option value="Investment">Investment</option>
                  <option value="Gift">Gift</option>
                </optgroup>

                <optgroup label="Expense">
                  <option value="Food">Food</option>
                  <option value="Transportation">Transportation</option>
                  <option value="Shopping">Shopping</option>
                  <option value="Housing">Housing</option>
                  <option value="Bills">Bills</option>
                  <option value="Healthcare">Healthcare</option>
                  <option value="Education">Education</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Travel">Travel</option>
                  <option value="Other">Other</option>
                </optgroup>
              </select>
            </div>

            <div>
              <label>Type</label>
              <select class="type-input js-type-input">
                <option value="" selected disabled>Select Type</option>
                <option>Income</option>
                <option>Expense</option>
              </select>
            </div>

            <div>
              <label>Amount</label>
              <input
                type="number"
                class="amount-input js-amount-input"
                placeholder="Enter amount"
              />
            </div>
          </div>
          <div class="save-transaction-button-container">
            <button class="save-transaction-button js-save-transaction-button">
              Save Transaction
            </button>
          </div>
        </div>
        <div class="filters-section">
          <div class="filters-heading-container">
            <div class="filters-heading">
              <i class="fa-solid fa-sliders"></i>
              <span>Filters</span>
            </div>
          </div>

          <div class="filter-group">
            <label class="filter-label">Type</label>
            <select class="select-box js-type-filter" id="type-filter">
              <option value="">All</option>
              <option value="Income">Income</option>
              <option value="Expense">Expense</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Category</label>
            <select class="select-box js-category-filter">
              <option value="">All Categories</option>

              <optgroup label="Income">
                <option value="Salary">Salary</option>
                <option value="Freelance">Freelance</option>
                <option value="Business">Business</option>
                <option value="Investment">Investment</option>
                <option value="Gift">Gift</option>
              </optgroup>

              <optgroup label="Expense">
                <option value="Food">Food</option>
                <option value="Transportation">Transportation</option>
                <option value="Shopping">Shopping</option>
                <option value="Housing">Housing</option>
                <option value="Bills">Bills</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Education">Education</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Travel">Travel</option>
                <option value="Other">Other</option>
              </optgroup>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Month</label>
            <select class="select-box js-month-filter">
              <option value="">All Months</option>

              <option value="0">January</option>
              <option value="1">February</option>
              <option value="2">March</option>
              <option value="3">April</option>
              <option value="4">May</option>
              <option value="5">June</option>
              <option value="6">July</option>
              <option value="7">August</option>
              <option value="8">September</option>
              <option value="9">October</option>
              <option value="10">November</option>
              <option value="11">December</option>
            </select>
          </div>
        </div>

        <div class="transaction-table-container">
          <table class="transaction-table js-transaction-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Actions</th>
              </tr>
            </thead>

      </div>
    </div>
